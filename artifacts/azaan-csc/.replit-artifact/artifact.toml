kind = "web"
previewPath = "/"
title = "AZAAN CSC Management"
version = "1.0.0"
id = "artifacts/azaan-csc"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5173

[services.development]
run = "pnpm --filter @workspace/azaan-csc run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/azaan-csc", "run", "build" ]
serve = "static"
publicDir = "artifacts/azaan-csc/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5173"
BASE_PATH = "/"
